<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo secreto | Natal Hop!</title>
<meta name="description" content="Sorteio do amigo secreto do Natal Hop!">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head"><div class="wrap">
<a href="./"><img src="assets/wordmark.png" alt="Hop!"></a>
<nav aria-label="Principal">
<a href="./">Início</a>
<a href="eventos">Eventos</a>
<a href="cinema">Cinema</a>
<a href="ementa">Ementa</a>
<a href="musicas">Músicas</a>
<a href="amigo-secreto" aria-current="page">Amigo secreto</a>
<a href="sobre">Sobre</a>
<a href="bilheteira" class="cta">Bilheteira</a>
</nav></div></header>
<main><section class="sec"><div class="wrap" style="max-width:640px">
<h2>Amigo secreto</h2>
<p id="msg" role="status" class="meta" style="min-height:1.6em;color:var(--red-d);font-weight:700"></p>
<div id="app"></div>
</div></section></main>
<footer class="site-foot"><div class="wrap">
<img src="assets/wordmark.png" alt="Hop!">
<p>Natal Hop! de 23 a 26 de dezembro</p>
<p>Vem passar o Natal em família.</p>
</div></footer>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
const q=new URLSearchParams(location.search),G=q.get('g'),ORG=q.has('org');
const app=document.getElementById('app'),msg=t=>document.getElementById('msg').textContent=t||'';
const val=id=>document.getElementById(id).value;
const base=location.origin+location.pathname;
async function rpc(fn,args){
  let r;
  try{r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw new Error('Sem ligação. Tenta novamente.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'Erro inesperado.');
  if(j&&j.error)throw new Error(j.error);
  return j;
}
function onSubmit(id,fn){document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();msg('');try{await fn()}catch(x){msg(x.message)}})}
const people=l=>l.length?'<p><b>Já entraram ('+l.length+'):</b> '+l.map(esc).join(', ')+'</p>':'<p class="meta">Ainda ninguém entrou.</p>';
const copyBox=(t,u)=>'<label>'+t+'</label><input readonly value="'+esc(u)+'" onclick="this.select()">';

function viewCreate(){
  app.innerHTML='<form id="fc" class="card"><label for="n">Nome do sorteio</label><input id="n" required maxlength="80" placeholder="Amigo secreto Natal Hop!"><label for="pin">Código de organizador (mínimo 6 caracteres)</label><input id="pin" type="password" minlength="6" required autocomplete="new-password"><div class="actions"><button class="btn alt">Criar sorteio</button></div></form><div id="out"></div>';
  onSubmit('fc',async()=>{
    const r=await rpc('create_draw',{p_name:val('n'),p_admin_pin:val('pin')});
    document.getElementById('fc').hidden=true;
    document.getElementById('out').innerHTML='<div class="card"><h3>Sorteio criado</h3>'+copyBox('Link para os participantes',base+'?g='+r.id)+copyBox('O teu link de organizador (guarda-o, com o código)',base+'?g='+r.id+'&org=1')+'<p class="meta">Envia o primeiro link a quem vai participar. Depois de entrarem todos, usa o link de organizador para fazer o sorteio.</p></div>';
  });
}

async function viewDraw(){
  const d=await rpc('draw_info',{p_draw:G});
  let h='<h3>'+esc(d.name)+'</h3>'+people(d.participants);
  if(d.status==='open'){
    h+='<form id="fj" class="card"><h3>Entrar no sorteio</h3><label for="jn">O teu nome</label><input id="jn" required maxlength="60"><label for="jp">O teu código pessoal (mínimo 6 caracteres)</label><input id="jp" type="password" minlength="6" required autocomplete="new-password"><label for="jw">Pista de presente (opcional)</label><textarea id="jw" rows="2" maxlength="200"></textarea><p class="meta">Guarda o teu código: vais precisar dele para ver quem te saiu.</p><div class="actions"><button class="btn alt">Entrar</button></div></form>';
  }else{
    h+='<form id="fr" class="card"><h3>Ver o meu amigo secreto</h3><label for="rn">O teu nome</label><input id="rn" required><label for="rp">O teu código pessoal</label><input id="rp" type="password" required><div class="actions"><button class="btn alt">Ver</button></div><div id="res" style="margin-top:1rem"></div></form>';
  }
  app.innerHTML=h;
  if(d.status==='open')onSubmit('fj',async()=>{
    await rpc('join_draw',{p_draw:G,p_name:val('jn'),p_pin:val('jp'),p_wish:val('jw')});
    await viewDraw();msg('Entraste no sorteio! Guarda o teu código pessoal.');
  });
  else onSubmit('fr',async()=>{
    const r=await rpc('reveal',{p_draw:G,p_name:val('rn'),p_pin:val('rp')});
    document.getElementById('res').innerHTML='<p>O teu amigo secreto é</p><p style="font:600 2.4rem/1.1 Fredoka,sans-serif;color:var(--red);margin:0">'+esc(r.giftee)+'</p>'+(r.wish?'<p class="meta">Pista de presente: '+esc(r.wish)+'</p>':'');
  });
}

async function viewOrg(){
  const d=await rpc('draw_info',{p_draw:G});
  const open=d.status==='open';
  app.innerHTML='<h3>'+esc(d.name)+'</h3>'+copyBox('Link para os participantes',base+'?g='+G)+
    '<div class="card" style="margin-top:1rem"><label for="op">O teu código de organizador</label><input id="op" type="password" autocomplete="current-password"></div>'+
    '<h3 style="margin-top:1.5rem">Participantes ('+d.participants.length+')</h3>'+
    (d.participants.length?d.participants.map(n=>'<div class="song"><span>'+esc(n)+'</span>'+(open?'<button class="mini del" data-n="'+esc(n)+'">Remover</button>':'')+'</div>').join(''):'<div class="empty">Ainda ninguém entrou.</div>')+
    '<div class="actions">'+(open?'<button class="btn" id="run">Fazer o sorteio</button>':'<p>O sorteio já foi feito. Os participantes já podem ver o seu amigo secreto.</p><button class="btn ghost" id="reset">Refazer o sorteio</button>')+'</div>';
  const go=async(fn,args,ok)=>{msg('');try{await rpc(fn,Object.assign({p_draw:G,p_admin_pin:val('op')},args));await viewOrg();msg(ok)}catch(x){msg(x.message)}};
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>confirm('Remover '+b.dataset.n+'?')&&go('remove_participant',{p_name:b.dataset.n},'Participante removido.'));
  const run=document.getElementById('run'),reset=document.getElementById('reset');
  if(run)run.onclick=()=>confirm('Fazer o sorteio agora? Depois ninguém mais pode entrar.')&&go('run_draw',{},'Sorteio feito!');
  if(reset)reset.onclick=()=>confirm('Refazer o sorteio? Os resultados atuais serão apagados.')&&go('reset_draw',{},'Sorteio reaberto.');
}

if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('SEU-PROJETO'))msg('Falta configurar o Supabase no ficheiro config.js.');
else if(!G)viewCreate();
else (ORG?viewOrg():viewDraw()).catch(x=>msg(x.message));
</script>
</body></html>
