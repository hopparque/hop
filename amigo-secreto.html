<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo secreto | Natal Hop!</title>
<meta name="description" content="Sorteio do amigo secreto do Natal Hop!">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head"><div class="wrap">
<a href="./"><img src="assets/wordmark.png" alt="Hop!"></a>
<nav aria-label="Principal">
<a href="./">Início</a>
<a href="eventos">Eventos</a>
<a href="cinema">Cinema</a>
<a href="ementa">Ementa</a>
<a href="musicas">Músicas</a>
<a href="amigo-secreto" aria-current="page">Amigo secreto</a>
<a href="sobre">Sobre</a>
<a href="bilheteira" class="cta">Bilheteira</a>
</nav></div></header>
<main><section class="sec"><div class="wrap" style="max-width:560px">
<h2>Amigo secreto</h2>
<p id="msg" role="status" class="meta" style="min-height:1.6em;color:var(--red-d);font-weight:700"></p>
<div id="app"></div>
</div></section></main>
<footer class="site-foot"><div class="wrap">
<img src="assets/wordmark.png" alt="Hop!">
<p>Natal Hop! de 23 a 26 de dezembro</p>
<p>Vem passar o Natal em família.</p>
</div></footer>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
const app=document.getElementById('app'),msg=t=>document.getElementById('msg').textContent=t||'';
const val=id=>document.getElementById(id).value;
async function rpc(fn,args){
  let r;
  try{r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw new Error('Sem ligação. Tenta novamente.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'Erro inesperado.');
  if(j&&j.error)throw new Error(j.error);
  return j;
}
function onSubmit(id,fn){document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();msg('');try{await fn()}catch(x){msg(x.message)}})}

function viewCode(c){
  app.innerHTML='<form id="fc" class="card"><label for="c">Código do sorteio</label><input id="c" required autocomplete="off" value="'+esc(c||'')+'"><div class="actions"><button class="btn alt">Entrar</button></div></form>';
  onSubmit('fc',()=>viewNames(val('c').trim()));
}
async function viewNames(code){
  const r=await rpc('sorteio_nomes',{p_code:code});
  app.innerHTML='<form id="fn" class="card"><label for="nm">Quem és tu?</label><select id="nm" required><option value="">Escolhe o teu nome</option>'+r.names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><div class="actions"><button class="btn alt">Sortear</button></div><div id="res" style="margin-top:1rem" aria-live="polite"></div></form>';
  onSubmit('fn',async()=>{
    const res=document.getElementById('res');
    res.textContent='A sortear...';
    const [x]=await Promise.all([rpc('sortear',{p_code:code,p_name:val('nm')}),new Promise(r=>setTimeout(r,1200))]).catch(e=>{res.textContent='';throw e});
    res.innerHTML='<p style="margin:0">O teu amigo secreto é</p><p style="font:600 2.6rem/1.1 Fredoka,sans-serif;color:var(--red);margin:.2rem 0">'+esc(x.giftee)+'</p><p class="meta">Guarda este nome em segredo.</p>';
  });
}
if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('SEU-PROJETO'))msg('Falta configurar o Supabase no ficheiro config.js.');
else{const c=new URLSearchParams(location.search).get('c');if(c)viewNames(c).catch(x=>{msg(x.message);viewCode(c)});else viewCode()}
</script>
</body></html>
