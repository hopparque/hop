<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinema | Natal Hop!</title>
<meta name="description" content="Os filmes em exibição no Natal Hop!, de 23 a 26 de dezembro.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head"><div class="wrap">
<a href="./"><img src="assets/wordmark.png" alt="Hop!"></a>
<nav aria-label="Principal">
<a href="./">Início</a>
<a href="eventos">Eventos</a>
<a href="cinema" aria-current="page">Cinema</a>
<a href="ementa">Ementa</a>
<a href="musicas">Músicas</a>
<a href="sobre">Sobre</a>
<a href="bilheteira" class="cta">Bilheteira</a>
</nav></div></header>
<main><section class="sec"><div class="wrap">
<h2>Cinema</h2>
<p>Os filmes em exibição no Hop! de 23 a 26 de dezembro.</p>
<div class="tabs" id="tabs"></div>
<div class="films" id="films"></div>
</div></section></main>
<footer class="site-foot"><div class="wrap">
<img src="assets/wordmark.png" alt="Hop!">
<p>Natal Hop! de 23 a 26 de dezembro</p>
<p>Vem passar o Natal em família.</p>
</div></footer>
<script src="site.js"></script>
<script>
let F=[],sel='todos';
const tabs=document.getElementById('tabs'),box=document.getElementById('films');
function draw(){
  tabs.innerHTML=[['todos','Todos']].concat(DAYS.map(d=>[d.slice(8),d.slice(8)+' dez'])).map(t=>'<button aria-pressed="'+(sel===t[0])+'" data-d="'+t[0]+'">'+t[1]+'</button>').join('');
  const cards=F.map(f=>{
    const ss=(f.sessions||[]).filter(s=>sel==='todos'||s.date.slice(8)===sel).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    if(!ss.length)return '';
    return '<article class="film">'+(f.poster?'<img class="poster" src="'+esc(f.poster)+'" alt="Cartaz de '+esc(f.title)+'" loading="lazy">':'<div class="poster ph">'+esc(f.title)+'</div>')+
      '<div class="fb"><h3>'+esc(f.title)+(f.rating?'<span class="chip">'+esc(f.rating)+'</span>':'')+'</h3>'+(f.synopsis?'<p>'+esc(f.synopsis)+'</p>':'')+
      '<div class="sess">'+ss.map(s=>'<span>'+fmt(s.date,{day:'numeric',month:'short'})+', '+esc(s.time)+'</span>').join('')+'</div></div></article>';
  }).join('');
  box.innerHTML=cards||'<div class="empty">Ainda não há filmes neste dia.</div>';
}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sel=b.dataset.d;draw()});
fetch('data/cinema.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{F=d;draw()}).catch(()=>{box.innerHTML='<div class="empty">Não foi possível carregar os filmes. Tenta novamente mais tarde.</div>'});
loadEvents().then(r=>draftBar(r.draft));
</script>
</body></html>
