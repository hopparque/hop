<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos | Natal Hop!</title>
<meta name="description" content="Natal Hop! de 23 a 26 de dezembro. Vem passar o Natal em família com o Hop!">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head"><div class="wrap">
<a href="./"><img src="assets/wordmark.png" alt="Hop!"></a>
<nav aria-label="Principal">
<a href="./">Início</a>
<a href="eventos" aria-current="page">Eventos</a>
<a href="ementa">Ementa</a>
<a href="musicas">Músicas</a>
<a href="sobre">Sobre</a>
<a href="bilheteira" class="cta">Bilheteira</a>
</nav></div></header>
<main><section class="sec"><div class="wrap">
<h2>Eventos de Natal</h2>
<p>Escolhe um dia para ver o que vai acontecer no Hop!</p>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</div></section></main>
<footer class="site-foot"><div class="wrap">
<img src="assets/wordmark.png" alt="Hop!">
<p>Natal Hop! de 23 a 26 de dezembro</p>
<p>Vem passar o Natal em família.</p>
</div></footer>
<script src="site.js"></script>
<script>
let EV=[],sel='todos';
const tabs=document.getElementById('tabs'),list=document.getElementById('list');
function draw(){
  tabs.innerHTML=[['todos','Todos']].concat(DAYS.map(d=>[d.slice(8),d.slice(8)+' dez'])).map(t=>'<button aria-pressed="'+(sel===t[0])+'" data-d="'+t[0]+'">'+t[1]+'</button>').join('');
  const ds=DAYS.filter(d=>sel==='todos'||d.slice(8)===sel);
  list.innerHTML=ds.map(d=>{
    const es=sortEv(EV.filter(e=>e.date===d));
    return '<h3 class="day-title" id="dia-'+d.slice(8)+'">'+fmt(d,{weekday:'long',day:'numeric',month:'long'})+'</h3>'+(es.length?es.map(evHTML).join(''):'<div class="empty">Ainda não há eventos neste dia.</div>');
  }).join('');
}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sel=b.dataset.d;history.replaceState(null,'',sel==='todos'?'eventos':'#dia-'+sel);draw()});
loadEvents().then(r=>{
  draftBar(r.draft);EV=r.events;
  const m=location.hash.match(/^#dia-(\d\d)$/);if(m&&DAYS.some(d=>d.slice(8)===m[1]))sel=m[1];
  draw();
  if(r.error)list.insertAdjacentHTML('afterbegin','<div class="empty">Não foi possível carregar os eventos. Tenta novamente mais tarde.</div>');
});
</script>
</body></html>
